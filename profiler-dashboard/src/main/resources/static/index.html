<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Method Profiler Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #4a4a7e;
        }
        h1 { color: #00d9ff; }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #16213e;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #00d9ff;
        }
        .stat-card .value {
            font-size: 2em;
            font-weight: bold;
            color: #00d9ff;
        }
        .stat-card .label { color: #aaa; margin-top: 5px; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #16213e;
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #2a3a5e;
        }
        th {
            background: #0f3460;
            color: #00d9ff;
            font-weight: 600;
        }
        tr:hover { background: #1e2e4e; }
        .method-name {
            font-family: monospace;
            color: #ffeb3b;
            max-width: 400px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .error { color: #ff5252; }
        .ok { color: #4caf50; }
        button {
            padding: 10px 20px;
            background: #00d9ff;
            color: #1a1a2e;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #00b8d4; }
        .loading {
            text-align: center;
            padding: 40px;
            color: #aaa;
        }
    </style>
</head>
<body>
<div class="header">
    <h1>🔬 Method Profiler Dashboard</h1>
    <div>
        <button onclick="refresh()">🔄 Refresh</button>
        <button onclick="resetMetrics()">🗑 Reset</button>
    </div>
</div>

<div class="stats" id="stats"></div>

<table id="metricsTable">
    <thead>
    <tr>
        <th>Method</th>
        <th>Invocations</th>
        <th>Avg (ms)</th>
        <th>Min (ms)</th>
        <th>Max (ms)</th>
        <th>Total (ms)</th>
        <th>Memory (KB)</th>
        <th>Errors</th>
    </tr>
    </thead>
    <tbody id="metricsBody">
    <tr><td colspan="8" class="loading">Loading...</td></tr>
    </tbody>
</table>

<script>
    async function fetchMetrics() {
        try {
            const res = await fetch('/api/metrics');
            return await res.json();
        } catch (e) {
            console.error(e);
            return [];
        }
    }

    function renderStats(metrics) {
        const totalInvocations = metrics.reduce((s, m) => s + m.invocations, 0);
        const totalErrors = metrics.reduce((s, m) => s + m.errors, 0);
        const avgTime = metrics.length === 0 ? 0 :
            metrics.reduce((s, m) => s + m.avgTimeMs, 0) / metrics.length;

        document.getElementById('stats').innerHTML = `
                <div class="stat-card">
                    <div class="value">${metrics.length}</div>
                    <div class="label">Methods Tracked</div>
                </div>
                <div class="stat-card">
                    <div class="value">${totalInvocations}</div>
                    <div class="label">Total Invocations</div>
                </div>
                <div class="stat-card">
                    <div class="value">${avgTime.toFixed(2)} ms</div>
                    <div class="label">Avg Response</div>
                </div>
                <div class="stat-card">
                    <div class="value ${totalErrors > 0 ? 'error' : 'ok'}">${totalErrors}</div>
                    <div class="label">Total Errors</div>
                </div>
            `;
    }

    function renderTable(metrics) {
        metrics.sort((a, b) => b.totalTimeMs - a.totalTimeMs);

        const tbody = document.getElementById('metricsBody');
        if (metrics.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="loading">No metrics yet. Start your app!</td></tr>';
            return;
        }

        tbody.innerHTML = metrics.map(m => `
                <tr>
                    <td class="method-name" title="${m.method}">${m.method}</td>
                    <td>${m.invocations}</td>
                    <td>${m.avgTimeMs.toFixed(2)}</td>
                    <td>${m.minTimeMs.toFixed(2)}</td>
                    <td>${m.maxTimeMs.toFixed(2)}</td>
                    <td>${m.totalTimeMs.toFixed(2)}</td>
                    <td>${m.totalMemoryKB.toFixed(2)}</td>
                    <td class="${m.errors > 0 ? 'error' : 'ok'}">${m.errors}</td>
                </tr>
            `).join('');
    }

    async function refresh() {
        const metrics = await fetchMetrics();
        renderStats(metrics);
        renderTable(metrics);
    }

    async function resetMetrics() {
        if (!confirm('Reset all metrics?')) return;
        await fetch('/api/reset', { method: 'POST' });
        await refresh();
    }

    // Auto refresh every 2 seconds
    refresh();
    setInterval(refresh, 2000);
</script>
</body>
</html>
