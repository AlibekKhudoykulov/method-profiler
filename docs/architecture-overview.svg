<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" font-family="Segoe UI, Arial, sans-serif">
  <!-- Background -->
  <rect width="900" height="550" fill="#f8fafc" rx="12"/>

  <!-- JVM Process Container -->
  <rect x="30" y="30" width="840" height="340" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="60" y="60" font-size="16" font-weight="bold" fill="#4338ca">☕ JVM Process</text>

  <!-- Your Application Box -->
  <rect x="60" y="90" width="240" height="160" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="180" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">Your Application</text>
  <text x="180" y="155" text-anchor="middle" font-size="12" fill="#166534">@Profile methods</text>
  <text x="180" y="175" text-anchor="middle" font-size="12" fill="#166534">Business Logic</text>
  <text x="180" y="210" text-anchor="middle" font-size="28">📦</text>

  <!-- Profiler Agent Box -->
  <rect x="400" y="80" width="440" height="270" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="620" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#854d0e">Profiler Agent (ByteBuddy)</text>

  <!-- TimingAdvice -->
  <rect x="420" y="125" width="150" height="50" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="495" y="145" text-anchor="middle" font-size="11" fill="#991b1b">⏱️ TimingAdvice</text>
  <text x="495" y="163" text-anchor="middle" font-size="10" fill="#991b1b">(enter / exit)</text>

  <!-- MemoryAdvice -->
  <rect x="590" y="125" width="150" height="50" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="665" y="145" text-anchor="middle" font-size="11" fill="#991b1b">💾 MemoryAdvice</text>
  <text x="665" y="163" text-anchor="middle" font-size="10" fill="#991b1b">(allocation tracking)</text>

  <!-- MetricsCollector -->
  <rect x="450" y="195" width="200" height="50" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="550" y="215" text-anchor="middle" font-size="11" fill="#5b21b6">📊 MetricsCollector</text>
  <text x="550" y="233" text-anchor="middle" font-size="10" fill="#5b21b6">(Singleton, Thread-safe)</text>

  <!-- MethodMetric -->
  <rect x="450" y="260" width="200" height="50" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="550" y="280" text-anchor="middle" font-size="11" fill="#5b21b6">📈 MethodMetric</text>
  <text x="550" y="298" text-anchor="middle" font-size="10" fill="#5b21b6">(AtomicLong counters)</text>

  <!-- HTTP Server -->
  <rect x="680" y="220" width="140" height="55" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="750" y="243" text-anchor="middle" font-size="11" fill="#1e293b">🌐 HTTP Server</text>
  <text x="750" y="261" text-anchor="middle" font-size="10" fill="#475569">port 9999</text>

  <!-- Arrow: App -> Agent (bytecode injection) -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6366f1"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ca8a04"/>
    </marker>
  </defs>

  <line x1="300" y1="150" x2="395" y2="150" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="348" y="140" text-anchor="middle" font-size="9" fill="#6366f1">bytecode inject</text>

  <line x1="300" y1="190" x2="395" y2="220" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="340" y="215" text-anchor="middle" font-size="9" fill="#16a34a">metrics</text>

  <!-- Arrow: TimingAdvice -> Collector -->
  <line x1="495" y1="175" x2="520" y2="192" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Arrow: Collector -> MethodMetric -->
  <line x1="550" y1="245" x2="550" y2="257" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Arrow: Collector -> HTTP -->
  <line x1="650" y1="230" x2="677" y2="240" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Web Dashboard -->
  <rect x="580" y="420" width="220" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="690" y="452" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">🖥️ Web Dashboard</text>
  <text x="690" y="472" text-anchor="middle" font-size="11" fill="#1e40af">Spring Boot</text>
  <text x="690" y="490" text-anchor="middle" font-size="10" fill="#3b82f6">http://localhost:8080</text>

  <!-- Developer -->
  <rect x="180" y="430" width="180" height="65" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="270" y="458" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">🧑‍💻 Developer</text>
  <text x="270" y="478" text-anchor="middle" font-size="11" fill="#64748b">Browser / curl</text>

  <!-- Arrow: HTTP Server -> Dashboard -->
  <path d="M 750 275 L 750 390 L 710 417" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="6,3"/>
  <text x="770" y="380" font-size="9" fill="#2563eb">GET /metrics</text>

  <!-- Arrow: Developer -> Dashboard -->
  <line x1="360" y1="462" x2="577" y2="462" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="468" y="453" text-anchor="middle" font-size="9" fill="#64748b">view metrics</text>
</svg>

