<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Segoe UI, Arial, sans-serif">
  <!-- Background -->
  <rect width="800" height="400" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Data Flow Diagram</text>

  <!-- Step 1: Method Called -->
  <rect x="30" y="70" width="160" height="55" rx="25" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="110" y="95" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">@Profile method</text>
  <text x="110" y="112" text-anchor="middle" font-size="11" fill="#1e40af">called</text>

  <!-- Step 2: TimingAdvice -->
  <rect x="240" y="70" width="150" height="55" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="315" y="93" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">⏱️ TimingAdvice</text>
  <text x="315" y="112" text-anchor="middle" font-size="10" fill="#991b1b">enter() → exit()</text>

  <!-- Step 3: MetricsCollector -->
  <rect x="440" y="70" width="170" height="55" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="525" y="93" text-anchor="middle" font-size="11" font-weight="bold" fill="#5b21b6">📊 MetricsCollector</text>
  <text x="525" y="112" text-anchor="middle" font-size="10" fill="#5b21b6">record(method, duration)</text>

  <!-- Step 4: MethodMetric -->
  <rect x="440" y="170" width="170" height="80" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="525" y="192" text-anchor="middle" font-size="11" font-weight="bold" fill="#5b21b6">📈 MethodMetric</text>
  <line x1="450" y1="200" x2="600" y2="200" stroke="#c4b5fd" stroke-width="1"/>
  <text x="465" y="216" font-size="10" fill="#6d28d9">• invocationCount</text>
  <text x="465" y="230" font-size="10" fill="#6d28d9">• totalTime / avg / min / max</text>
  <text x="465" y="244" font-size="10" fill="#6d28d9">• memory / errors</text>

  <!-- Step 5: JsonExporter -->
  <rect x="440" y="295" width="170" height="55" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="525" y="318" text-anchor="middle" font-size="11" font-weight="bold" fill="#854d0e">📝 JsonExporter</text>
  <text x="525" y="337" text-anchor="middle" font-size="10" fill="#854d0e">toJSON()</text>

  <!-- Step 6: JSON Response -->
  <rect x="660" y="295" width="120" height="55" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="720" y="318" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">✅ JSON</text>
  <text x="720" y="337" text-anchor="middle" font-size="10" fill="#166534">Response</text>

  <!-- GET /metrics label -->
  <rect x="300" y="295" width="110" height="55" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="355" y="318" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">🌐 HTTP</text>
  <text x="355" y="337" text-anchor="middle" font-size="10" fill="#64748b">GET /metrics</text>

  <!-- Arrows -->
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6366f1"/>
    </marker>
    <marker id="arrDown" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Arrow 1→2 -->
  <line x1="190" y1="97" x2="237" y2="97" stroke="#6366f1" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Arrow 2→3 -->
  <line x1="390" y1="97" x2="437" y2="97" stroke="#6366f1" stroke-width="2" marker-end="url(#arr)"/>
  <text x="413" y="88" text-anchor="middle" font-size="9" fill="#6366f1">record()</text>

  <!-- Arrow 3→4 -->
  <line x1="525" y1="125" x2="525" y2="167" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrDown)"/>
  <text x="555" y="148" font-size="9" fill="#7c3aed">store</text>

  <!-- Arrow 4→5 -->
  <line x1="525" y1="250" x2="525" y2="292" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrDown)"/>
  <text x="555" y="275" font-size="9" fill="#7c3aed">export</text>

  <!-- Arrow HTTP→5 -->
  <line x1="410" y1="322" x2="437" y2="322" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Arrow 5→6 -->
  <line x1="610" y1="322" x2="657" y2="322" stroke="#16a34a" stroke-width="2" marker-end="url(#arr)"/>
</svg>

